name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # assembleDebugAndroidTest compiles the instrumented migration tests
      # without running them (no emulator here) - so they can't rot unnoticed.
      # Run them locally against a device: ./gradlew connectedDebugAndroidTest
      - name: Lint, unit tests, debug build
        run: >
          ./gradlew lint testDebugUnitTest assembleDebug assembleDebugAndroidTest
          --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tidylink-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload lint & test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
          retention-days: 7
