# Builds a signed release APK when a v* tag is pushed and attaches it to a
# GitHub Release.
#
# Required repository secrets:
#   RELEASE_KEYSTORE_BASE64  - base64 of the release keystore file
#                              (e.g. `base64 -i release.jks | pbcopy`)
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # Secrets are passed via env, NOT interpolated straight into the script.
      # `${{ }}` pastes the secret's raw text into the shell source, so any
      # metacharacter in it is then interpreted by bash. An unquoted heredoc
      # here silently mangled a password containing a '$' followed by digits:
      # bash read it as a positional parameter and expanded it to nothing, so
      # the file got a truncated password and the build failed with the very
      # misleading "keystore password was incorrect".
      # Reading "$VAR" expands the variable exactly once - the value itself is
      # never re-scanned - which is both correct and injection-safe.
      #
      # Never quote a real secret in a comment to illustrate a bug. Comments
      # ship. Describe the shape of the input instead.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      # Last line of defence. Two ways a release gets signed with the wrong key:
      #
      #   1. keystore.properties missing/broken -> app/build.gradle.kts falls
      #      back to the DEBUG key and still produces a valid-looking APK.
      #   2. RELEASE_KEYSTORE_BASE64 holds a STALE key (e.g. one that was
      #      rotated locally but never updated here) -> the APK is signed with
      #      a key nobody holds any more, and every install of it is orphaned.
      #
      # A "CN=" check cannot catch (2): a rotated key usually keeps the same
      # subject name. Only the certificate fingerprint distinguishes them, so
      # pin it. Set the repository VARIABLE (not secret - a public-key
      # fingerprint isn't sensitive, and vars are readable in logs, which is
      # what makes a mismatch debuggable):
      #
      #   Settings -> Secrets and variables -> Actions -> Variables ->
      #     RELEASE_CERT_SHA256 = AA:BB:CC:...  (from:
      #       keytool -list -v -keystore release.jks | grep "SHA256:")
      #
      # Leave it unset and the job still blocks debug keys, but cannot detect
      # a stale one - it will say so loudly.
      - name: Verify the release signer
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -Vr | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found - cannot verify the signer."
            exit 1
          fi

          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"

          if grep -q "CN=Android Debug" <<< "$CERTS"; then
            echo "::error::Release APK is DEBUG-SIGNED - refusing to publish. Check the RELEASE_* secrets."
            exit 1
          fi

          ACTUAL=$(sed -n 's/.*[Ss][Hh][Aa]-256 digest: *//p' <<< "$CERTS" | head -n1 \
                   | tr -d ' :' | tr 'A-F' 'a-f')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not parse the signer's SHA-256 from apksigner output."
            exit 1
          fi
          echo "signer SHA-256: $ACTUAL"

          if [ -z "${EXPECTED_SHA256:-}" ]; then
            echo "::warning::RELEASE_CERT_SHA256 variable is not set - cannot verify this is the CURRENT key, only that it isn't the debug key. Set it to pin the signer."
            exit 0
          fi

          EXPECTED=$(tr -d ' :' <<< "$EXPECTED_SHA256" | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signer mismatch - refusing to publish."
            echo "::error::expected $EXPECTED"
            echo "::error::actual   $ACTUAL"
            echo "::error::RELEASE_KEYSTORE_BASE64 is probably a stale key. Re-upload it from your current keystore."
            exit 1
          fi
          echo "OK - release APK is signed with the expected key."

      # Derived once, used for both the Release title and the APK filename, so
      # the two can never drift apart. The tag drives everything: v1.0 ->
      # "TidyLink-1.0" + TidyLink-1.0.apk, v1.1 -> "TidyLink-1.1", and so on.
      # No edit needed per release.
      #
      # Read via env, not "${{ }}" straight into the script: `${{ }}` pastes
      # the value into the shell source, so a tag containing a metacharacter
      # would be interpreted rather than used. Same class of bug as the
      # signing-secret heredoc above - see the comment there.
      - name: Derive release name from tag
        id: rel
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          echo "name=TidyLink-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        env:
          RELEASE_NAME: ${{ steps.rel.outputs.name }}
        run: cp app/build/outputs/apk/release/app-release.apk "$RELEASE_NAME.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.rel.outputs.name }}
          files: ${{ steps.rel.outputs.name }}.apk
          generate_release_notes: true

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties
